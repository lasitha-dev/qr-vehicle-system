# ================================
# SERVER CONFIGURATION
# ================================
server.port=8081
server.servlet.context-path=/

# ================================
# APPLICATION INFO
# ================================
spring.application.name=QR Vehicle System
app.name=QR Vehicle System - University of Peradeniya
app.version=1.0.0

# ================================
# PRIMARY DATABASE (Vehicle QR DB)
# Env vars (SPRING_DATASOURCE_URL, etc.) override these in Docker
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vehicle_qr_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Use physical naming strategy to preserve exact column names from @Column annotations
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ================================
# THYMELEAF
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ================================
# STATIC RESOURCES
# ================================
spring.web.resources.static-locations=classpath:/static/

# ================================
# FILE UPLOAD
# ================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# CUSTOM PATHS
# Env vars (APP_UPLOAD_CERTIFICATE_PATH, etc.) override these in Docker
# ================================
app.upload.certificate-path=${APP_UPLOAD_CERTIFICATE_PATH:./uploads/certificates/}
app.upload.qrcode-path=${APP_UPLOAD_QRCODE_PATH:./uploads/qrcodes/}
app.upload.image-path=${APP_UPLOAD_IMAGE_PATH:./uploads/images/}

# ================================
# BACKUP
# ================================
app.backup.path=${APP_BACKUP_PATH:./backups/}
app.backup.mysqldump-path=mysqldump

# ================================
# GOOGLE OAUTH2 (Update with your credentials)
# ================================
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ================================
# KEYCLOAK OIDC (University SSO)
# ================================
spring.security.oauth2.client.registration.keycloak.client-id=vehicle-pass-app
spring.security.oauth2.client.registration.keycloak.client-secret=vF9F8m66pwBBaJ5A0I9uh9CNXLnoeMQS
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.client-name=University SSO (Keycloak)

spring.security.oauth2.client.provider.keycloak.issuer-uri=https://idp-auth.pdn.ac.lk/realms/idp-auth-realm
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Custom Keycloak OIDC config (app-level)
app.oidc.client-id=vehicle-pass-app
app.oidc.client-secret=vF9F8m66pwBBaJ5A0I9uh9CNXLnoeMQS
app.oidc.issuer-uri=https://idp-auth.pdn.ac.lk/realms/idp-auth-realm
app.oidc.redirect-uri=https://gatepass.pdn.ac.lk/login/oauth2/code/keycloak
app.oidc.post-logout-redirect-uri=https://gatepass.pdn.ac.lk
app.oidc.session-name=KCSESSID
app.oidc.token-refresh-threshold-seconds=60
app.oidc.token-refresh-grace-seconds=30

# ================================
# SECONDARY DATABASE (Student DB - studdb)
# For local dev: localhost:3306/studdb (run studdb-init.sql to create)
# For production: dbwala.pdn.ac.lk:3306/studdb
# Env vars (APP_DATASOURCE_STUDDB_URL, etc.) override these in Docker
# ================================
app.datasource.studdb.url=${APP_DATASOURCE_STUDDB_URL:jdbc:mysql://localhost:3306/studdb?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true}
app.datasource.studdb.username=${APP_DATASOURCE_STUDDB_USERNAME:root}
app.datasource.studdb.password=${APP_DATASOURCE_STUDDB_PASSWORD:}
app.datasource.studdb.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# EMAIL / SMTP
# In Docker, Mailpit intercepts all emails (SPRING_MAIL_HOST=maildev, port=1025)
# ================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:lasithaathulathmudali98@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ayxk lbwn ezkj mste}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=nilupas79@gs.pdn.ac.lk
app.mail.from-name=UOP Vehicle Registration

# ================================
# SESSION
# ================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ================================
# LOGGING
# ================================
logging.level.root=INFO
logging.level.com.uop.qrvehicle=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=app.log

# ================================
# ERROR HANDLING
# ================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
